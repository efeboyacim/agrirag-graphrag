# Questions the system must decline.
#
# These are the most valuable goldens in the set, and the easiest to leave out.
# Without them, every metric rewards a system that answers everything confidently -
# there is no case where declining is the correct behaviour, so nothing measures
# whether the agent knows what it does not know.
#
# Two kinds:
#   off-domain    nothing in the graph or corpus is remotely related
#   out-of-scope  agricultural, but outside what this knowledge base holds

- id: off_domain_kubernetes
  input: How do I configure a Kubernetes ingress controller?
  expected_route: any
  must_abstain: true
  hops: 0
  expected_entity_ids: []
  expected_output: >-
    I don't have enough information to answer that from the agricultural knowledge base.
  context: []

