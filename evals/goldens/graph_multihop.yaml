  expected_route: graph
  hops: 2
  expected_entity_ids: [pest_yellow_rust]
  expected_output: >-
    Tebuconazole at 0.75 L/ha and azoxystrobin at 1.0 L/ha both give high efficacy,
    and both carry a 35-day pre-harvest interval.
  context:
    - Yellow rust is treated by tebuconazole at 0.75 L/ha with high efficacy and a 35-day pre-harvest interval.
