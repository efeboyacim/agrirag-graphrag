- id: verticillium_practices
  input: Which farming practices reduce verticillium wilt?
  expected_route: graph
  hops: 1
  expected_entity_ids: [pest_verticillium]
  expected_output: >-
    Crop rotation, because non-host crops starve the soilborne microsclerotia, and
    soil solarization, because sustained heating inactivates microsclerotia in the
    tilled layer before planting.
  context:
    - Crop rotation mitigates verticillium wilt - non-host crops starve the soilborne microsclerotia and lower field inoculum over successive seasons.
    - Soil solarization mitigates verticillium wilt - sustained heating inactivates microsclerotia in the tilled layer before planting.

