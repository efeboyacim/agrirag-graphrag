# Questions whose answers are relationships, not topics.
#
# Every expected_output and context line below is derived from data/seed/*.csv.
# That is the payoff of a hand-authored corpus: the ground truth is known because
# the same person wrote the data and the question.

- id: maize_konya_organic
  input: Which organic-approved treatments exist for maize pests in Konya?
  expected_route: graph
  hops: 3
  expected_entity_ids: [crop_maize, reg_konya]
  expected_output: >-
    Bacillus thuringiensis and spinosad are the organic-approved options. Bt controls
    both fall armyworm and European corn borer at 1.0 kg/ha with a 0-day pre-harvest
    interval; spinosad controls fall armyworm at 0.2 L/ha with a 3-day interval.
  context:
    - Maize is susceptible to fall armyworm and European corn borer, both of which are established in the Konya basin in summer.
    - Bacillus thuringiensis is organic-approved and controls fall armyworm and European corn borer at 1.0 kg/ha with high efficacy and a 0-day pre-harvest interval.
    - Spinosad is organic-approved and controls fall armyworm at 0.2 L/ha with high efficacy and a 3-day pre-harvest interval.
    - Cotton bollworm also attacks maize but is not established in the Konya basin.

- id: maize_konya_restricted
  input: Are any maize pest treatments restricted in the Konya region?
  expected_route: graph
  hops: 4
  expected_entity_ids: [crop_maize, reg_konya]
  expected_output: >-
    Yes. Chlorpyrifos-ethyl, deltamethrin and lambda-cyhalothrin are all governed by
    the Turkish Plant Protection Products Regulation, which is in force in Konya.
    Chlorpyrifos in particular had its approval withdrawn.
  context:
    - Chlorpyrifos-ethyl is used against fall armyworm and is restricted by the Turkish Plant Protection Products Regulation.
    - The Turkish Plant Protection Products Regulation applies in the Konya basin.
    - EU instruments such as Regulation (EU) 2020/18 apply to the export-facing regions rather than Konya.

- id: wheat_rotation
  input: What should I rotate with wheat, and why?
  expected_route: graph
  hops: 1
  expected_entity_ids: [crop_wheat]
  expected_output: >-
    Chickpea fixes nitrogen and breaks the cereal foliar disease cycle. Sunflower
    uses subsoil moisture with a deep taproot and hosts no rust. Sugar beet has a
    different rooting depth and reduces cereal pathogen carryover. Cotton benefits
    from a winter cereal between crops because it lowers verticillium inoculum.
  context:
    - Wheat rotates with chickpea; the legume fixes nitrogen and breaks the cereal foliar disease cycle.
    - Wheat rotates with sunflower; a deep taproot exploits subsoil moisture and it hosts no rust.
    - Wheat rotates with sugar beet; different rooting depth and residue chemistry reduce carryover of cereal pathogens.
    - Cotton rotates with wheat; a winter cereal between cotton crops lowers verticillium inoculum build-up.

- id: wheat_clay_practices_rust
  input: Which practices suit wheat on clay soils, and do any also reduce rust pressure?
  expected_route: graph
  hops: 3
  expected_entity_ids: [crop_wheat]
  expected_output: >-
    No-till direct seeding and soil solarization are recommended for clay loam.
    Wheat-specific practices include crop rotation, deficit irrigation, split
    nitrogen and resistant cultivar selection. Of these, resistant cultivar
    selection also reduces yellow rust, because cultivars carrying effective Yr
    genes block or slow pustule development.
  context:
    - Wheat is suited to clay loam and loam soils.
    - No-till direct seeding is recommended for clay loam soils; soil solarization is also recommended for clay loam.
    - Resistant cultivar selection is recommended for wheat and mitigates yellow rust - cultivars carrying effective Yr resistance genes block or slow pustule development.
    - Crop rotation, deficit irrigation and split nitrogen application are recommended for wheat.

- id: cotton_pests_cukurova
  input: What pests affect cotton in the Cukurova plain?
  expected_route: graph
  hops: 2
  expected_entity_ids: [crop_cotton, reg_cukurova]
  expected_output: >-
    Cotton bollworm at flowering, cotton whitefly during vegetative growth, and
    verticillium wilt at flowering - all three are established in Cukurova during
    summer.
  context:
    - Cotton is susceptible to cotton bollworm at flowering with high severity.
    - Cotton is susceptible to cotton whitefly during vegetative growth with high severity.
    - Cotton is susceptible to verticillium wilt at flowering with high severity.
    - Cotton bollworm, cotton whitefly and verticillium wilt are all established in the Cukurova plain in summer.

- id: hazelnut_soil
  input: What soil does hazelnut need, and where is it grown?
  expected_route: graph
  hops: 2
  expected_entity_ids: [crop_hazelnut]
  expected_output: >-
    Hazelnut is suited to acidic forest soil within pH 5.0 to 6.5. That soil is
    highly prevalent in the Eastern Black Sea, which is where the crop is grown.
  context:
    - Hazelnut is suited to acidic forest soil within pH 5.0-6.5.
    - Acidic forest soil has silt loam texture, good drainage and about 4.0 percent organic matter.
    - Acidic forest soil is highly prevalent in the Eastern Black Sea region.
    - Hazelnut is grown in the Eastern Black Sea with high suitability and a typical yield of 1.1 t/ha.

