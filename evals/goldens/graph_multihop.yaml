  expected_entity_ids: [crop_chickpea]
  expected_output: >-
    Chickpea is susceptible to ascochyta blight at flowering and to cotton bollworm
    at podding. Ascochyta is treated with azoxystrobin at 1.0 L/ha, and crop
    rotation plus resistant cultivars also reduce it.
  context:
